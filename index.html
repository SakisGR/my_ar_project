<!-- import aframe and ar.js (NFT) -->
<script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1c2407b26c61958baa93967b5412487cd94b290b/dist/aframe-master.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

<style>
  .arjs-loader {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-size: 1.25em;
  }
</style>

<body style="margin: 0; overflow: hidden;">
  <div class="arjs-loader">
    <div>Loading, please wait...</div>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; colorManagement: true"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >

    <a-nft
      type="nft"
      url="https://sakisgr.github.io/my_ar_project/nft/image"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    >

      <!-- 🔹 CONTAINER ENTITY -->
      <!-- μεταφέρει όλο το 3D μακριά από την κάμερα -->
      <a-entity position="0 0 40">

        <!-- 🔹 ACTUAL MODEL -->
        <a-entity
          gltf-model="https://sakisgr.github.io/my_ar_project/model/model.gltf"
          scale="0.5 0.5 0.5"
          position="0 -5 0"
          rotation="0 0 0"
          material="side: double">
        </a-entity>

      </a-entity>
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>
</body>
